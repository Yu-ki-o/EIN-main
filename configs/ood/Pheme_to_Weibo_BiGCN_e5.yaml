# Single-source cross-dataset zero-shot OOD; see docs/OOD.md.
model_name: EIN
dataset: Weibo
num_classes: 2
language: ch
word_embedding: multilingual-e5-base
e5_model_name: intfloat/multilingual-e5-base
e5_max_length: 128
e5_batch_size: 64
result_name: ood_pheme_to_weibo_bigcn_e5
experiment_mode: ood
ood_source_datasets:
- Pheme
ood_val_domain: source
debug: false
seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.0001
patience: 10
n_epochs: 100
selection_metric: val_loss
batch_size: 128
hidden_dim: 64
in_feats: 768
tokenize_mode: jieba
vector_size: 200
undirected: false
n_layers_conv: 3
n_layers_feat: 1
n_layers_fc: 2
skip_connection: true
res_branch: BNConvReLU
dropout: 0.1
edge_norm: true
global_pool: sum
base_model: BiGCN
max_hop: 72
init_alpha: 1.0
init_beta: 1.0
lamda: 0.5
ood_manifest: dataset/ood_splits/pheme_to_weibo/seed_{seed}.json
e5_local_files_only: true
