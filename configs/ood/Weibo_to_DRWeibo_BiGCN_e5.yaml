# Single-source cross-dataset zero-shot OOD; see docs/OOD.md.
model_name: EIN
dataset: DRWeibo
num_classes: 2
language: ch
word_embedding: multilingual-e5-base
e5_model_name: intfloat/multilingual-e5-base
e5_max_length: 128
e5_batch_size: 64
result_name: ood_weibo_to_drweibo_bigcn_e5
experiment_mode: ood
ood_source_datasets:
- Weibo
ood_val_domain: source
debug: false
seed: 0
device: cuda
lr: 0.0005
weight_decay: 1.0e-05
patience: 10
n_epochs: 100
selection_metric: val_loss
batch_size: 128
hidden_dim: 128
TDdroprate: 0.2
BUdroprate: 0.2
tokenize_mode: jieba
vector_size: 200
in_feats: 768
n_layers_conv: 3
aug1: DropEdge,mean,0.2,0.7
aug2: NodeDrop,0.2,0.7
n_layers_feat: 1
n_layers_fc: 2
skip_connection: true
res_branch: BNConvReLU
dropout: 0.3
edge_norm: true
global_pool: sum
undirected: false
base_model: BiGCN
max_hop: 72
init_alpha: 0.5
init_beta: 0.5
lamda: 0.001
ood_manifest: dataset/ood_splits/weibo_to_drweibo/seed_{seed}.json
e5_local_files_only: true
