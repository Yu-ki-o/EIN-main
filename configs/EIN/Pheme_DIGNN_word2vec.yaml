# DIGNN-inspired topology/text disentanglement for event-level rumor detection.
model_name: EIN
base_model: DIGNN
dataset: Pheme
num_classes: 2
language: en
word_embedding: word2vec
result_name: dignn_attention_hsic_batch128_noTextStrucRecon_noEdgeRecon_noIndepent
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: False

seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.001
patience: 15
n_epochs: 100
selection_metric: val_loss
split: '622'
num_workers: 0

batch_size: 128 #32 #128
hidden_dim: 64
in_feats: 200
vector_size: 200
tokenize_mode: nltk
k: 10000
n_layers_conv: 3
dropout: 0.4 #0.1
undirected: True

# Initial settings, not empirically tuned. Attention order: topology, text.
dignn_fusion: attention
dignn_text_recon_weight: 0 #0.01
dignn_structure_recon_weight: 0 #0.01
dignn_edge_recon_weight: 0 #0.01
dignn_independence_weight: 0 #0.001

# Shared data/trainer interface; no epidemiological state-prediction loss.
max_hop: 47
lamda: 0.0
