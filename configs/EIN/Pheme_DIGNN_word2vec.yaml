# Stance-WL topology + source-conditioned soft topics (v1).
model_name: EIN
base_model: DIGNN
dataset: Pheme
num_classes: 2
language: en
word_embedding: word2vec
result_name: dignn_pheme_wl_topics_v1
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: False

seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.001
patience: 15
n_epochs: 100
selection_metric: val_loss
split: '622'
num_workers: 0

batch_size: 128 #32 #128
hidden_dim: 64
in_feats: 200
vector_size: 200
tokenize_mode: nltk
k: 10000
n_layers_conv: 3
dropout: 0.4 #0.1
undirected: True

# Initial settings, not empirically tuned. Attention order: topology, text.
dignn_fusion: attention
dignn_topology_features: wl
dignn_text_mode: topics # mean restores the previous WL text branch
# Initial topic settings; tune on validation data only.
dignn_topic_clusters: 4
dignn_topic_steps: 3
dignn_topic_temperature: 0.5
dignn_topic_semantic_relations: true
dignn_topic_propagation: true
dignn_topic_semantic_weight: 0.05
dignn_topic_diversity_weight: 0.01
dignn_topic_pair_budget: 256
dignn_topic_log_assignments: false
dignn_wl_rounds: 2
dignn_wl_buckets: 8192
dignn_wl_heads: 4
dignn_wl_clusters: [64, 32, 16]
dignn_wl_cache_size: 256
dignn_wl_log_attention: false
dignn_text_recon_weight: 0 #0.01
dignn_structure_recon_weight: 0 #0.01
dignn_edge_recon_weight: 0 #0.01
dignn_independence_weight: 0 #0.001

# Shared data/trainer interface; no epidemiological state-prediction loss.
max_hop: 47
lamda: 0.0
