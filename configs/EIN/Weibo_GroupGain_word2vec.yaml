# model and data
model_name: EIN
base_model: GroupGain
dataset: Weibo
num_classes: 2
language: ch
word_embedding: word2vec
result_name: group_gain_full_undirected_valloss_word2vec
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: False

# main.py runs seeds 0-4 unless --seed is supplied.
# Initial research settings; these are not tuned dataset-specific results.
seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.0001
patience: 20
n_epochs: 100
selection_metric: val_loss
split: '622'
num_workers: 0
batch_size: 128
hidden_dim: 128
in_feats: 200
vector_size: 200
tokenize_mode: jieba
k: 10000
n_layers_conv: 2
dropout: 0.2
global_pool: mean

# Reuse the existing fixed-feature cache; GroupGain reads the original
# parent-to-child directed_edge_index and adds distinct inverse relations.
undirected: True
group_gain_edge_direction: null
group_gain_stance_target: generic

# Reply grouping and conditional gain supervision.
group_gain_variant: full_model
group_gain_group_pooling: max
group_gain_group_cos_threshold: 0.95
group_gain_gate_mode: both
group_gain_gate_temperature: 0.2
group_gain_lambda_gain: 1.0
group_gain_candidates_per_graph: 2
group_gain_contexts_per_candidate: 1
group_gain_full_context_probability: 0.5
group_gain_correct_only: True
group_gain_micro_batch_size: 64

# Select the ungated teacher on validation loss, then pretrain the gain head
# and jointly train the student. Teacher training adds a separate budget.
group_gain_teacher_max_epochs: 100
group_gain_teacher_patience: 20
group_gain_teacher_lr: 0.0005
group_gain_teacher_mask_probability: 0.5
group_gain_gain_head_epochs: 5
group_gain_gain_head_lr: 0.0005
group_gain_student_max_epochs: 100
group_gain_student_patience: 20
group_gain_student_lr: 0.0005

# Required by the shared data/trainer interface; no auxiliary state loss.
max_hop: 72
lamda: 0.0
