# model and data
model_name: EIN
base_model: Plain_GCN
dataset: DRWeibo
num_classes: 2
language: ch
word_embedding: word2vec
result_name: plain_gcn_undirected_valloss_word2vec
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: False

# training parameters (main.py runs seeds 0-4 unless --seed is supplied)
seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.0001
patience: 10
n_epochs: 100
selection_metric: val_loss
split: '622'
num_workers: 0

# plain GCN: normalized convolutions, ReLU/dropout, graph pooling, classifier
batch_size: 128
hidden_dim: 128
in_feats: 200
vector_size: 200
tokenize_mode: jieba
k: 10000
n_layers_conv: 3
dropout: 0.3
global_pool: mean
undirected: True

# Required by the shared data/trainer interface; GCN does not model states.
max_hop: 20
lamda: 0.0
