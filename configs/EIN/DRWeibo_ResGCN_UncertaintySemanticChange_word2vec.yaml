# model and data
model_name: EIN
dataset: DRWeibo
num_classes: 2
language: ch
word_embedding: word2vec
e5_model_name: intfloat/multilingual-e5-base
e5_max_length: 128
e5_batch_size: 64
result_name:  test_jioalianloss_bigcn_hingeaux1_margin0 #test_ResGCN_0.5bias #original_zhengli_test_resgcn_nobias #newplus_Resgcn_viewmi0.00_changetreemi0.1_sharemi0.1_exclusivemi0.01_bias0.5 #A_resgcn_mlpmi0.01_sharemi0.00_bias0 # set a name to save logs under experiments/EIN/DRWeibo/<result_name>
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: False
use_tensorboard: True
tensorboard_log_dir: tensorboard

# training parameters
seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.0001
patience: 10
n_epochs: 100
selection_metric: val_loss
split: '622'
legacy_dataset_cache_name: UncertaintySemanticChange_BiGCN_change_semantic_tree_manifest_ds

# model parameters
batch_size: 128
hidden_dim: 128
in_feats: 200
tokenize_mode: jieba
k: 10000
vector_size: 200
undirected: False
n_layers_conv: 3
dropout: 0.3
global_pool: mean

base_model: BiGCN_UncertaintySemanticChange
max_hop: 20
lamda: 0.0
# mean (default), gcn, or probabilistic_sgcn (soft-probability SGCN)
semantic_parity_aggregation: mean
semantic_parity_direction: bottom_up #bidirectional #bottom_up

# edge support/deny relation encoder
relation_hidden_dim: 128
relation_temperature: 1.0
stance_route_temperature: 0.5
stance_route_hard: True
lambda_edge_relation_aux: 0.05 #修0.05 #0.05
lambda_edge_relation_warmup: 0.5 # 修0.5
# Optional 2-hop structural-balance regularizer. Targets are derived online
# from existing parent-child stance labels; no data preprocessing is required.
use_structural_balance_loss: False
lambda_structural_balance_aux: 0.05
structural_balance_warmup_epochs: 5
lambda_view_mi_aux: 0.01 #修0.01

# mutually exclusive edge relation routing: softmax, ds, or dirichlet
edge_relation_distribution: softmax
use_ds_mass_routing: True #废弃参数
use_dirichlet_relation_routing: False
dirichlet_relation_prior: 1.0
dirichlet_relation_sample: False
dirichlet_teacher_strength: 10.0
dirichlet_teacher_smoothing: 0.05
ds_unknown_prior: 2.0
lambda_ds_unknown_edge_aux: 0.0

# entropy-guided differentiable Bernoulli sampling
use_uncertainty_sampling: False
uncertainty_sample_temperature: 0.5
uncertainty_keep_floor: 0.05
uncertainty_sampling_warmup_epochs: 5
use_degree_importance: True
degree_importance_strength: 1.0

# Uncertainty-Calibrated Continuous Semantic Transport (UCST).
# False preserves the original hard support/deny parity propagation.
use_ucst: false
ucst_reversal_temperature: 1.0
ucst_uncertainty_strength: 1.0
ucst_reliability_strength: 0.5
ucst_detach_uncertainty: true
ucst_delta_hidden_dim: 128
ucst_delta_dropout: 0.3
ucst_delta_warmup_epochs: 5
lambda_ucst_delta_aux: 0.001

# replaceable node-level semantic change encoder: mlp, tanh, or dpga
semantic_change_encoder: mlp
semantic_change_hidden_dim: 128
use_gaussian_semantic_change_bottleneck: True
semantic_change_gaussian_latent_dim: 128
semantic_change_gaussian_sample: False
lambda_semantic_change_bottleneck:  0.0 #修0.001 #0.001
lambda_semantic_tree_change_mi_aux: 0.01 #修0.01

# Label-sufficient attention complementary fusion (LSACF).  This is opt-in;
# when enabled, set lambda_semantic_tree_change_mi_aux to 0.0 to avoid also
# applying the legacy unconditional branch decorrelation objective.
use_semantic_tree_attention_complementary_fusion: false
semantic_tree_evidence_temperature: 0.5
semantic_tree_evidence_rank_margin: 0.2
semantic_tree_evidence_residual_init: 0.0
semantic_tree_evidence_warmup_epochs: 5
semantic_tree_conditional_redundancy_stop_change: true
semantic_tree_evidence_interaction_hidden_dim: 256
semantic_tree_evidence_interaction_dropout: 0.3
lambda_semantic_tree_evidence_sufficiency_aux: 0.01
lambda_semantic_tree_evidence_rank_aux: 0.005
lambda_semantic_tree_conditional_redundancy_aux: 0.001
# True: node_keep-weighted change pooling; False: ordinary graph pooling
use_node_keep_in_change_pool: False

# root-path vertical attention with edge-router uncertainty bias
use_vertical_path_attention: False
vertical_path_attention_heads: 4
vertical_path_attention_max_distance: 20
vertical_path_attention_uncertainty_scale: 1.0
vertical_path_attention_residual_gate: 1.0
vertical_path_attention_dropout: 0.3

# inject support/deny node semantics and depth into the propagation tree
# The *_semantic_tree fusion modes activate this branch automatically.  Keep
# the standalone flag off so classification_fusion_mode: ot is a pure OT run.
use_semantic_tree_transformer: False
semantic_tree_input_mode: support_deny_original
semantic_tree_query_mode:  learned #gaussian_shared_exclusive #learned_shared_gaussian_exclusive 
semantic_tree_num_queries: 1

# Low-rank event-adaptive Semantic-tree diagnostic query experts.
# When enabled, semantic_tree_query_mode must be learned/root/root_learned and
# semantic_tree_num_queries must remain 1.
use_semantic_tree_query_experts: false
semantic_tree_query_expert_num: 4
semantic_tree_query_expert_topk: 2
semantic_tree_query_expert_basis_rank: 8
semantic_tree_query_expert_adapter_rank: 8
semantic_tree_query_expert_router_temperature: 1.0
semantic_tree_query_expert_responsibility_temperature: 0.5
semantic_tree_query_expert_competence_weight: 1.0
semantic_tree_query_expert_warmup_epochs: 5
semantic_tree_query_expert_sinkhorn_iterations: 3
semantic_tree_query_expert_counterfactual_margin: 0.1
semantic_tree_query_expert_detach_responsibility: true
semantic_tree_query_expert_residual_gate_init: -4.0
lambda_semantic_tree_query_expert_classification_aux: 0.01
lambda_semantic_tree_query_expert_routing_aux: 0.01
lambda_semantic_tree_query_expert_diversity_aux: 0.001
lambda_semantic_tree_query_expert_counterfactual_aux: 0.01
semantic_tree_gaussian_query_sample: False
semantic_tree_gaussian_query_condition_shared_variance: true
semantic_tree_gaussian_query_initial_logvar: -4.0
semantic_tree_gaussian_query_min_logvar: -8.0
semantic_tree_gaussian_query_max_logvar: 4.0
semantic_tree_gaussian_query_reliability_temperature: 1.0
semantic_tree_gaussian_query_shared_mi_temperature: 0.02 #原0.2
semantic_tree_gaussian_query_exclusive_mi_temperature: 0.02 #原0.2
semantic_tree_gaussian_query_detach_uncertainty: false
semantic_tree_dual_query_output_mode: context
lambda_semantic_tree_query_kl_aux: 0.001
lambda_semantic_tree_query_shared_mi_aux: 0.1
lambda_semantic_tree_query_exclusive_mi_aux: 0.01
lambda_semantic_tree_query_diversity_aux: 0.01
lambda_semantic_tree_query_classification_aux: 0.01
semantic_tree_transformer_layers: 1
semantic_tree_attention_temperature: 1.0
semantic_tree_transformer_ffn_dim: 256
semantic_tree_transformer_dropout: 0.3
semantic_tree_transformer_max_depth: 20
semantic_tree_depth_dim: 128
semantic_tree_transformer_pool: mean
use_semantic_tree_change_uncertainty_bias: True #修True
semantic_tree_uncertainty_source: edge_relation #edge_relation
semantic_tree_uncertainty_bias_scale:  0.5 #0.5
semantic_tree_change_uncertainty_detach: True
# Self-limiting reliable-vs-uncertain evidence supervision. When enabled,
# Semantic-tree uncertainty bias must also be enabled above.
use_semantic_tree_reliability_hinge_loss: True
semantic_tree_reliability_hinge_margin: 0
lambda_semantic_tree_reliability_hinge_aux: 1
use_change_uncertainty_pooling: False
change_uncertainty_pool_scale: 0.5
change_uncertainty_pool_detach: False

# root-relative support/uncertain/deny state, depth size, and growth trend
uncertainty_trend_hidden_dim: 128
use_trend_graph: False

# local support/deny conflict OT (used only by ot / ot_semantic_tree)
ot_local_hops: 3
ot_entropic_regularization: 0.1
ot_sinkhorn_iterations: 20
ot_structure_cost_weight: 0.25
ot_max_events_per_side: 16
ot_detach_transport_plan: false

# reciprocal evidence proposal-verification collaboration
# Requires classification_fusion_mode to contain both change and semantic_tree.
# Query mode must be learned, root, or root_learned when this switch is true.
use_reciprocal_evidence_collaboration: false
repv_num_slots: 4
repv_proposal_temperature: 1.0
repv_proposal_bias_scale: 0.5
repv_counterfactual_temperature: 1.0
repv_warmup_epochs: 5
repv_ramp_epochs: 5
repv_residual_gate_init: -2.0
repv_dropout: 0.3
lambda_repv_classification_aux: 0.1
lambda_repv_feedback_aux: 0.1
lambda_repv_overlap_aux: 0.01
lambda_repv_diversity_aux: 0.001

# cross-scale evidence-state transition (CEST)
# Requires a fusion mode containing both change and semantic_tree.
use_cross_scale_evidence_transition: false
cest_hidden_dim: 128
cest_use_relation_condition: true
cest_use_semantic_residual: true
cest_use_depth_phase: false
cest_use_uncertainty_weight: false
cest_attention_scale: 1.0
cest_residual_gate_init: -2.0
cest_dropout: 0.3

# final branch fusion
classification_fusion_mode: change_semantic_tree # alternatives: codebook | codebook_semantic_tree | ot | ot_semantic_tree
classification_fusion_hidden_dim: 256
classification_class_weights: [1.0, 1.0] #原来是[1.0, 1.0]

# optional graph-level Dempster-Shafer fusion over final branches
use_global_ds_fusion: false
global_ds_unknown_prior: 1.0
global_ds_temperature: 1.0
global_ds_fusion_rule: dempster
global_ds_hidden_dim: 128

use_conflict_field_bottleneck: False
conflict_encoder_mode: transformer
conflict_attention_heads: 4
conflict_attention_layers: 1
conflict_attention_ffn_dim: 256
conflict_attention_dropout: 0.3
conflict_attention_max_depth: 20
conflict_attention_depth_dim: 128
conflict_attention_pool: mean
conflict_attention_key_scale: 1.0
conflict_attention_boundary_scale: 1.0
conflict_attention_region_scale: 1.0
lambda_conflict_label_aux: 0.1
lambda_conflict_size_aux: 0.01
lambda_conflict_redundancy_aux: 0.01
conflict_keep_threshold: 0.5
conflict_balance_weight: 1.0
conflict_high_frequency_weight: 0.5



# TDdroprate: 0.2
# BUdroprate: 0.2
# undirected: True
