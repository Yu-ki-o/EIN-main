model_name: EIN
dataset: Twitter
num_classes: 2
language: en
word_embedding: word2vec
e5_model_name: intfloat/multilingual-e5-base
e5_max_length: 128
e5_batch_size: 64
result_name: Twitter_KAGNN_UncertaintySemanticChange_word2vec
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: false
seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.0001
patience: 10
n_epochs: 100
selection_metric: val_loss
split: '622'
batch_size: 128
hidden_dim: 64
in_feats: 200
tokenize_mode: nltk
k: 10000
vector_size: 200
undirected: false
n_layers_conv: 2
dropout: 0.1
global_pool: mean
base_model: KAGNN_UncertaintySemanticChange
max_hop: 147
lamda: 0.0
kagnn_variant: KAGCN
kagnn_num_layers: 2
kagnn_hidden_layers: 1
kagnn_grid_size: 4
kagnn_spline_order: 3
kagnn_heads: 4
relation_hidden_dim: 64
relation_temperature: 1.0
stance_route_temperature: 0.5
stance_route_hard: true
lambda_edge_relation_aux: 0.1
lambda_edge_relation_warmup: 0.5
lambda_view_mi_aux: 0.01
uncertainty_sample_temperature: 0.5
uncertainty_keep_floor: 0.05
uncertainty_sampling_warmup_epochs: 5
use_degree_importance: true
degree_importance_strength: 1.0
semantic_change_encoder: mlp
semantic_change_hidden_dim: 64
# Optional multi-hop trajectory prototypes for the Change branch.
use_trajectory_prototype_change: false
trajectory_prototype_num: 4
trajectory_prototype_dim: 64
trajectory_prototype_temperature: 0.5
trajectory_prototype_dropout: 0.1
trajectory_prototype_residual_gate_init: -2.0
lambda_trajectory_prototype_diversity_aux: 0.001
lambda_trajectory_prototype_balance_aux: 0.001
use_node_keep_in_change_pool: false
use_vertical_path_attention: true
vertical_path_attention_heads: 4
vertical_path_attention_max_distance: 147
vertical_path_attention_uncertainty_scale: 1.0
vertical_path_attention_residual_gate: 1.0
vertical_path_attention_dropout: 0.1
uncertainty_trend_hidden_dim: 64
use_trend_graph: false
# cross-scale evidence-state transition (CEST)
# Enable only with a fusion mode containing change and semantic_tree.
use_cross_scale_evidence_transition: false
cest_hidden_dim: 64
cest_use_relation_condition: true
cest_use_semantic_residual: true
cest_use_depth_phase: false
cest_use_uncertainty_weight: false
cest_attention_scale: 1.0
cest_residual_gate_init: -2.0
cest_dropout: 0.1
classification_fusion_mode: original_change_vertical # alternatives: codebook | codebook_semantic_tree
classification_fusion_hidden_dim: 128
classification_class_weights:
- 1.0
- 1.0
