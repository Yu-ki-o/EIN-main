# WL v2 with variational IB; optimization settings are not retuned for this model.
model_name: EIN
base_model: DIGNN
dataset: Weibo
num_classes: 2
language: ch
word_embedding: word2vec
result_name: dignn_weibo_wl_v2_ib
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: false
seed: 0
device: cuda:1
lr: 0.0003
weight_decay: 0.003
patience: 20
n_epochs: 100
selection_metric: val_loss
split: '622'
num_workers: 0
batch_size: 128 #64
hidden_dim: 64
in_feats: 200
vector_size: 200
tokenize_mode: jieba
k: 10000
n_layers_conv: 3
dropout: 0.5
undirected: true
dignn_fusion: attention
dignn_topology_features: wl
dignn_wl_rounds: 2
dignn_wl_buckets: 8192
dignn_wl_heads: 4
dignn_wl_clusters: [64, 32, 16]
dignn_wl_cache_size: 256
dignn_wl_log_attention: false
dignn_ib_enabled: true
dignn_ib_beta: 0.001
dignn_ib_classification_weight: 0.1
dignn_ib_warmup_epochs: 10
dignn_text_recon_weight: 0 #0.01
dignn_structure_recon_weight:  0 #0.01
dignn_edge_recon_weight: 0 #0.01
dignn_independence_weight: 0 #0.001
max_hop: 72
lamda: 0.0
