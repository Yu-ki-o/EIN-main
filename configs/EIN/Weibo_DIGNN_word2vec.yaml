# Structural probes + soft topics; optimization settings are not retuned.
model_name: EIN
base_model: DIGNN
dataset: Weibo
num_classes: 2
language: ch
word_embedding: word2vec
result_name: dignn_weibo_probe_topics_v1
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: false
seed: 0
device: cuda:1
lr: 0.0003
weight_decay: 0.003
patience: 10
n_epochs: 100
selection_metric: val_loss
split: '622'
num_workers: 0
batch_size: 128 #64
hidden_dim: 64
in_feats: 200
vector_size: 200
tokenize_mode: jieba
k: 10000
n_layers_conv: 3
dropout: 0.5
undirected: true
dignn_fusion: attention
dignn_topology_features: probe
dignn_probe_scales: [0.25, 1.0, 4.0]
dignn_probe_mode: ordered # untyped / typed / ordered
dignn_probe_cache_size: 256 # CPU event-response LRU; 0 disables caching
dignn_text_mode: topics # mean uses the text-only MLP/readout
# Initial topic settings; tune on validation data only.
dignn_topic_clusters: 4
dignn_topic_steps: 3
dignn_topic_temperature: 0.5
dignn_topic_semantic_relations: true
dignn_topic_propagation: true
dignn_topic_semantic_weight: 0.05
dignn_topic_diversity_weight: 0.01
dignn_topic_pair_budget: 256
dignn_topic_log_assignments: false
dignn_text_recon_weight: 0 #0.01
dignn_structure_recon_weight:  0 #0.01
dignn_edge_recon_weight: 0 #0.01
dignn_independence_weight: 0 #0.001
max_hop: 72
lamda: 0.0
