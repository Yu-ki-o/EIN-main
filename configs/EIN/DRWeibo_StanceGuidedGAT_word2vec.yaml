# Relation-teacher-guided GAT with a selectable BiGCN/ResGCN backbone.
model_name: EIN
dataset: DRWeibo
num_classes: 2
language: ch
word_embedding: word2vec
result_name: stancegat_bigcn
experiment_mode: id
ood_source_datasets: []
ood_val_domain: source
debug: False

# training
seed: 0
device: cuda
lr: 0.0005
weight_decay: 0.0001
patience: 10
n_epochs: 100
selection_metric: val_loss
split: '622'

# text and graph encoder
batch_size: 128
hidden_dim: 128
tokenize_mode: jieba
k: 10000
vector_size: 200
in_feats: 200
n_layers_conv: 3
n_layers_feat: 1
n_layers_fc: 2
skip_connection: True
res_branch: BNConvReLU
dropout: 0.3
edge_norm: True
global_pool: sum
undirected: False
max_hop: 20
lamda: 0.0

base_model: StanceGuidedGAT
# Change only this field to switch the propagation backbone: bigcn or resgcn.
stance_gat_backbone: bigcn
stance_gat_dual_channel: true

# Parallel dual-channel GAT: shared transforms, no inter-layer channel mixing.
gat_num_layers: 2
gat_heads: 4
gat_attention_dropout: 0.2
gat_negative_slope: 0.2
stance_gat_fusion_hidden_dim: 256

# LLM-stance edge-relation teacher
stance_relation_hidden_dim: 128
stance_relation_dropout: 0.0
stance_relation_temperature: 1.0
# Legacy single-channel attention bias (unused when dual_channel is true).
stance_relation_attention_bias: 1.0
# p(channel)^power is multiplied into each child message without renormalizing.
stance_relation_gate_power: 1.0
stance_self_support_prior: 1.0
stance_relation_class_weights: [1.0, 1.0]
lambda_edge_relation: 0.1

# KL matches only the relative distribution among siblings; self is excluded.
lambda_attention_kl: 0.05
attention_kl_warmup_epochs: 5
attention_kl_ramp_epochs: 5
attention_kl_min_labeled_edges: 2
